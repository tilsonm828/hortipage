<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Promotion</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #5a8b5a;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .product-item {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        .product-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
        }
        .product-item h3 {
            margin-top: 0;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #5a8b5a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #4a7a4a;
        }

        #selections-container {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        #selections-container h2 {
            margin-top: 0;
            color: #5a8b5a;
        }

        #selected-products-list {
            list-style-type: none;
            padding: 0;
        }

        #selected-products-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border: 1px solid #eee;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        #selected-products-list li span {
            font-weight: bold;
        }

        #selected-products-list input[type="number"] {
            width: 60px;
            padding: 5px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Seasonal Promotion</h1>
        <p>Select the products you'd like to order:</p>
        <form id="promo-form" action="order-detail.html" name="order-form" method="GET">
        <!-- <form id="promo-form" name="order-form"> -->

            <div class="product-grid" id="product-grid">
                <!-- Products will be loaded here dynamically -->
            </div>

            <br>
            <div id="customer-details-container" style="margin-top: 20px;">
                <h2>Contact Info</h2>
                <div style="display: flex; gap: 20px;">
                    <div style="flex: 1;">
                        <label for="customer-name">Name:</label>
                        <input type="text" id="customer-name" name="customer-name" required style="width: 100%;">
                    </div>
                    <div style="flex: 1;">
                        <label for="customer-email">Email:</label>
                        <input type="email" id="customer-email" name="customer-email" required style="width: 100%;">
                    </div>
                </div>
                <div style="margin-top: 10px;">
                    <label for="customer-phone">Phone:</label> <br>
                    <input type="tel" id="customer-phone" name="customer-phone" required style="width: calc(50% - 10px);">
                </div>
                <div style="margin-top: 10px;">
                    <label for="customer-notes">Notes:</label> <br>
                    <textarea id="customer-notes" name="customer-notes" rows="3" style="width: 100%;"></textarea>
                </div>
            </div>
            <br>

            <div id="selections-container">
                <h2>Your Order</h2>
                <ul id="selected-products-list"></ul>
                <div id="total-amount-container" style="text-align: right; margin-top: 10px; font-weight: bold;"></div>
            <input type="hidden" id="total-order-amount" name="total-order-amount" value="0">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" style="flex: 1;">Submit</button>
                <button type="reset" id="download-order" style="flex: 1;">Reset</button>
                <button type="button" onclick="window.location.href='index.html'" style="flex: 1;">Home</button>
            </div>
        </form>
    </div>
    <script>
        let totalAmount = 0;

        // Update Total Amount when Quantity Changes
        function updateTotalAmount() {
            let totalAmount = 0;
            const quantityInputs = document.querySelectorAll('#selected-products-list input[type="number"]');
            quantityInputs.forEach(input => {
                const price = parseFloat(input.dataset.price);
                const quantity = parseInt(input.value, 10);
                totalAmount += price * quantity;
            });
            console.log("Total Amount: ", totalAmount);
            document.getElementById('total-amount-container').innerText = `Total: $${totalAmount.toFixed(2)}`;
            document.getElementById('total-order-amount').value = totalAmount.toFixed(2);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const productGrid = document.getElementById('product-grid');
            const form = document.getElementById('promo-form');
            const selectedProductsList = document.getElementById('selected-products-list');

            let products = [];

            fetch('data/products.json')
                .then(response => response.json())
                .then(data => {
                    products = data;
                    products.forEach(product => {
                        const productItem = document.createElement('div');
                        productItem.className = 'product-item';
                        productItem.innerHTML = `
                            <img src="${product.image}" alt="${product.name}">
                            <h3>${product.name} – $${product.price}</h3>
                            <p>${product.description}</p>
                            <input type="checkbox" id="${product.id}" name="product" value="${product.name}" data-image="${product.image}" data-price="${product.price}">
                            <label for="${product.id}">Select</label>
                        `;
                        productGrid.appendChild(productItem);
                    });

                    const checkboxes = document.querySelectorAll('input[name="product"]');
                    checkboxes.forEach(checkbox => {
                        checkbox.addEventListener('change', updateSelectedProducts);
                    });
                });

            
            // Update Selected Products when Checkboxes Change
            function updateSelectedProducts() {
                // Preserve quantities when re-rendering
                const quantityMap = new Map();
                const existingQuantityInputs = document.querySelectorAll('#selected-products-list input[type="number"]');
                existingQuantityInputs.forEach(input => {
                    quantityMap.set(input.dataset.productId, parseInt(input.value, 10));
                });

                selectedProductsList.innerHTML = '';
                const checkboxes = document.querySelectorAll('input[name="product"]:checked');

                if (checkboxes.length > 0) {
                    const header = document.createElement('li');
                    header.innerHTML = `
                        <span>Product</span>
                        <span>Quantity</span>
                    `;
                    header.style.fontWeight = 'bold';
                    header.style.borderBottom = '2px solid #ddd';
                    selectedProductsList.appendChild(header);
                }

                checkboxes.forEach(checkbox => {
                    const li = document.createElement('li');
                    const product = products.find(p => p.name === checkbox.value);
                    const price = parseFloat(checkbox.dataset.price);
                    const quantity = quantityMap.get(product.id) || 1;

                    li.innerHTML = `
                        <img src="${product.image}" alt="${product.name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-right: 10px;">
                        <span>${checkbox.value}</span>
                        <input type="hidden" name="product-name-${product.id}" value="${product.name}">
                        <input type="hidden" name="product-price-${product.id}" value="${price}">
                        <input type="number" min="1" value="${quantity}" name="quantity-${product.id}" data-product-id="${product.id}" data-price="${price}">
                    `;
                    selectedProductsList.appendChild(li);
                });

                updateTotalAmount();

                const quantityInputs = document.querySelectorAll('#selected-products-list input[type="number"]');
                quantityInputs.forEach(input => {
                    input.addEventListener('change', updateTotalAmount);
                });
            }

            // }

            document.getElementById('download-order').addEventListener('click', () => {
                const orderDetails = JSON.parse(localStorage.getItem('orderDetails'));
                if (orderDetails) {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(orderDetails, null, 2));
                    const downloadAnchorNode = document.createElement('a');
                    downloadAnchorNode.setAttribute("href", dataStr);
                    downloadAnchorNode.setAttribute("download", "orders.json");
                    document.body.appendChild(downloadAnchorNode); // required for firefox
                    downloadAnchorNode.click();
                    downloadAnchorNode.remove();
                }
            });

        });

</body>
</html>
