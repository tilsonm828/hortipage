<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;

            opacity: 1;
            transition: opacity 2s ease;
        }

        #splash.fade-out {
            opacity: 0;
        }

        #splash img {
            max-width: 100%;
            max-height: 100%;
        }

        #close-btn {
            /* position: absolute; */
            position: relative;
            bottom: 20px;
            right: 20px;

            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;

            font-size: 24px;
            cursor: pointer;

            background: rgba(0, 0, 0, 0.7);
            color: white;
        }

        #close-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }
    </style>
</head>
<body>

<div id="splash">
    <img src="welcome.png" alt="Welcome">
    <button id="close-btn" aria-label="Close">×</button>
</div>

<h1>My Website Content</h1>
<p>Your website content goes here.</p>

<script>
    const splash = document.getElementById('splash');
    const closeBtn = document.getElementById('close-btn');

    function closeSplash() {
        if (splash.classList.contains('fade-out')) return;

        splash.classList.add('fade-out');

        setTimeout(() => {
            splash.remove();
        }, 2000); // matches CSS transition duration
    }

    // Auto-close after 10 seconds
    setTimeout(closeSplash, 8000);

    // Manual close
    closeBtn.addEventListener('click', closeSplash);
</script>

</body>
</html>
