<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 20px auto;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .confirmation-message {
            color: #5a8b5a;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        .details-section {
            text-align: left;
            border-top: 1px solid #eee;
            margin-top: 20px;
            padding-top: 20px;
        }
        .detail-item {
            margin-bottom: 5px;
        }
        .detail-item strong {
            display: inline-block;
            width: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Order Confirmed!</h1>
        <p class="confirmation-message">Thank you for your order. Your details have been received.</p>
        
        <div class="details-section">
            <h2>Submitted Order Details</h2>
            <div id="submitted-details">
                <p>No details to display. (Note: For POST requests, this data needs to be processed by a server-side script to be displayed here.)</p>
            </div>
        </div>
        
        <p><a href="promo.html">Return to Promotions</a></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const submittedDetailsDiv = document.getElementById('submitted-details');
            const orderDetailsJson = localStorage.getItem('orderDetailsJson');

            if (orderDetailsJson) {
                const orderData = JSON.parse(orderDetailsJson);
                let detailsHtml = '';

                // Display Customer Details
                if (orderData.customer && Object.keys(orderData.customer).length > 0) {
                    detailsHtml += '<h3>Customer Information:</h3>';
                    for (const key in orderData.customer) {
                        detailsHtml += `<p class="detail-item"><strong>${key.charAt(0).toUpperCase() + key.slice(1)}:</strong> ${orderData.customer[key]}</p>`;
                    }
                }

                // Display Product Details
                if (orderData.products && orderData.products.length > 0) {
                    detailsHtml += '<h3>Order Items:</h3>';
                    orderData.products.forEach(product => {
                        const subtotal = (parseFloat(product.price) * product.quantity).toFixed(2);
                        detailsHtml += `
                            <p class="detail-item">
                                <strong>${product.name}</strong> x ${product.quantity} @ $${product.price} each = $${subtotal}
                            </p>
                        `;
                    });
                }

                // Display Total Amount
                if (orderData.totalAmount) {
                    detailsHtml += `<h3 style="text-align: right;">Total Order: $${orderData.totalAmount}</h3>`;
                }

                submittedDetailsDiv.innerHTML = detailsHtml;
                localStorage.removeItem('orderDetailsJson'); // Clean up localStorage
            } else {
                submittedDetailsDiv.innerHTML = '<p>No order details submitted or found.</p>';
            }
        });
    </script>
</body>
</html>
