<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #5a8b5a;
        }
        #order-summary {
            margin-top: 20px;
        }
        .order-item {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }
        .order-item:last-child {
            border-bottom: none;
        }
        .order-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 20px;
        }
        .order-item-details {
            flex-grow: 1;
        }
        .order-item-details h3 {
            margin: 0 0 10px;
        }
        #grand-total {
            text-align: right;
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Order Summary</h1>
        <div id="order-summary">
            <!-- Order details will be loaded here dynamically -->
        </div>
        <div id="grand-total">
            <!-- Grand total will be calculated here -->
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const orderSummary = document.getElementById('order-summary');
            const grandTotalElement = document.getElementById('grand-total');
            const orderDetails = JSON.parse(localStorage.getItem('orderDetails'));

            if (orderDetails && orderDetails.length > 0) {
                let grandTotal = 0;
                orderDetails.forEach(item => {
                    const orderItem = document.createElement('div');
                    orderItem.className = 'order-item';
                    orderItem.innerHTML = `
                        <img src="${item.image}" alt="${item.name}">
                        <div class="order-item-details">
                            <h3 style="color: #396139;">${item.name}</h3>
                            <p>Quantity: ${item.quantity}</p>
                            
                            <p>Subtotal: $${item.total.toFixed(2)}</p>
                        </div>
                    `;
                    orderSummary.appendChild(orderItem);
                    grandTotal += item.total;
                });

                grandTotalElement.textContent = `Grand Total: $${grandTotal.toFixed(2)}`;
            } else {
                orderSummary.innerHTML = '<p>No order details found.</p>';
            }
        });
    </script>
</body>
</html>
